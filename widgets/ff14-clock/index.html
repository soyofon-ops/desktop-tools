<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>FF14 時鐘</title>
<style>
  :root {
    --panel: rgba(18, 20, 30, 0.82);
    --gold: #c9a961;
    --gold-dim: rgba(201, 169, 97, 0.35);
    --text: #f3ead6;
    --muted: #a59d8a;
    --et: #8fd3ff;
    --lt: #ffd58f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    padding: 6px;
    font-family: "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", -apple-system, "PingFang TC", system-ui, sans-serif;
    color: var(--text);
  }
  .panel {
    position: relative;
    height: 100%;
    border-radius: 10px;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(80, 90, 130, 0.35), transparent 60%),
      var(--panel);
    border: 1px solid var(--gold-dim);
    box-shadow: inset 0 0 0 3px rgba(18, 20, 30, 0.6), inset 0 0 0 4px rgba(201, 169, 97, 0.18),
                0 4px 14px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 18px;
    cursor: pointer;
  }
  html.widget-dragging .panel { cursor: grabbing; }

  .label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: 0.12em; color: var(--muted);
  }
  .crystal {
    width: 8px; height: 12px;
    background: var(--accent);
    clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%);
    box-shadow: 0 0 6px var(--accent);
  }
  .main {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 2px;
  }
  .time {
    font-size: 40px; font-weight: 300; line-height: 1.05;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--text);
    text-shadow: 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .sub {
    margin-top: 2px;
    font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .sub b { font-weight: 600; color: var(--other); }

  body[data-mode="et"] { --accent: var(--et); --other: var(--lt); }
  body[data-mode="lt"] { --accent: var(--lt); --other: var(--et); }

  .swap { animation: swap 0.22s ease-out; }
  @keyframes swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body data-mode="et">
  <div class="panel" id="panel" title="點擊切換艾奧傑亞時間 / 本地時間，右鍵開啟選單">
    <div id="content">
      <div class="label"><span class="crystal"></span><span id="label">艾奧傑亞時間</span></div>
      <div class="main"><span class="time" id="time">--:--</span></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <script src="clock.js"></script>
</body>
</html>
