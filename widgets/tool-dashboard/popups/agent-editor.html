<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>編輯角色</title>
<link rel="stylesheet" href="popup.css">
<style>
  .form { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .form::-webkit-scrollbar { width: 8px; }
  .form::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }
  .look { display: flex; gap: 14px; align-items: flex-start; }
  .preview {
    flex: none; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 70%, transparent);
  }
  .pickers { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .swatches, .mascots { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--sw); }
  .mascot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--stroke); }
  .mascot:hover { border-color: var(--c); }
  .mascot[aria-checked="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); box-shadow: 0 0 0 1px var(--c); }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .row-model { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label, .label { font-size: 11px; color: var(--muted); }
  input[type="text"], textarea, select {
    width: 100%; min-width: 0; padding: 0 9px; height: 30px; border-radius: 6px; border: 1px solid var(--stroke);
    background: var(--surface); color: var(--text); font: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  input.invalid { border-color: var(--warn); }
  input[readonly] { color: var(--muted); cursor: default; }
  textarea { height: auto; padding: 7px 9px; resize: none; line-height: 1.5; }
  /* 角色說明填滿剩餘高度，吸收加入列、錯誤訊息與移除確認列造成的差距，整個表單不必捲動 */
  .field-grow { flex: 1 1 0; }
  .field-grow textarea { flex: 1 1 0; min-height: 72px; }
  .mono-in { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; font-size: 12px; }
  .folder { display: flex; gap: 6px; }
  .btn {
    height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--stroke); color: var(--text);
    font-size: 12px; white-space: nowrap; flex: none;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 600; padding: 0 16px; }
  .btn.danger { border-color: transparent; color: var(--warn); display: inline-flex; align-items: center; gap: 5px; }
  .btn.danger:hover { background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .chips2 { display: flex; gap: 6px; flex-wrap: wrap; }
  .tchip { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--stroke); color: var(--muted); font-size: 12px; }
  .tchip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .hint { font-size: 11px; color: var(--muted); }
  .file { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 6px; background: var(--surface); font-size: 11px; color: var(--muted); min-width: 0; }
  .file span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .import { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--stroke); }
  .import select { flex: 1; }
  .actions { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--stroke); }
  .actions .spacer { flex: 1; }
  .err { font-size: 12px; color: var(--warn); }
  .confirm-del { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 12px; background: color-mix(in srgb, var(--warn) 10%, transparent); border-top: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
  .confirm-del span { flex: 1; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-theme="dark">
  <div class="panel">
    <div class="titlebar">
      <h1 id="heading" style="flex: 1">新增角色</h1>
      <button class="close" id="close" aria-label="關閉" title="關閉（Esc）"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="form" id="form">
      <div class="import" id="import" hidden>
        <label for="existing" class="label" style="flex: none">從現有子代理加入</label>
        <select id="existing"></select>
        <button class="btn" id="import-btn">加入</button>
      </div>

      <div class="look">
        <span class="preview" id="preview" aria-hidden="true"></span>
        <div class="pickers">
          <div class="swatches" id="colors" role="radiogroup" aria-label="顏色"></div>
          <div class="mascots" id="mascots" role="radiogroup" aria-label="吉祥物"></div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="displayName">顯示名稱</label>
          <input type="text" id="displayName" placeholder="例如：程式審查員" maxlength="20">
        </div>
        <div class="field">
          <label for="name">代號（英文小寫、數字與 -）</label>
          <input type="text" id="name" class="mono-in" placeholder="code-reviewer" maxlength="64" spellcheck="false">
        </div>
      </div>

      <div class="field">
        <label for="description">何時使用（其他 Claude Code 會依這段決定要不要找它）</label>
        <input type="text" id="description" placeholder="例如：審查程式碼的正確性與可讀性，修改程式後使用">
      </div>

      <div class="field field-grow">
        <label for="prompt">角色說明</label>
        <textarea id="prompt" rows="5" placeholder="描述這個角色是誰、怎麼做事、回答的語氣與格式…"></textarea>
      </div>

      <div class="row-model">
        <div class="field">
          <label for="model">模型</label>
          <select id="model">
            <option value="">預設</option>
            <option value="opus">opus</option>
            <option value="sonnet">sonnet</option>
            <option value="haiku">haiku</option>
          </select>
        </div>
        <div class="field">
          <label for="cwd">工作資料夾</label>
          <div class="folder">
            <input type="text" id="cwd" class="mono-in" placeholder="預設為使用者資料夾" spellcheck="false">
            <button class="btn" id="pick">選擇…</button>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="label" id="tools-label">可用工具</span>
        <div class="chips2" role="group" aria-labelledby="tools-label">
          <button class="tchip" data-g="read" aria-pressed="true">讀取</button>
          <button class="tchip" data-g="search" aria-pressed="true">搜尋</button>
          <button class="tchip" data-g="edit" aria-pressed="true">修改檔案</button>
          <button class="tchip" data-g="bash" aria-pressed="true">執行指令</button>
          <button class="tchip" data-g="web" aria-pressed="true">網路</button>
        </div>
        <span class="hint" id="tools-hint">全部選取時也能使用 MCP 與其他子代理；修改檔案、執行指令前會在聊天視窗詢問你</span>
      </div>

      <div class="file" id="file">
        <svg class="icon" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <span class="mono" id="file-text"></span>
      </div>
      <div class="err" id="err" role="alert"></div>
    </div>

    <div class="confirm-del" id="confirm-del" hidden>
      <span id="del-text">移除這個角色？子代理檔案會移到資源回收筒，對話紀錄會刪除。</span>
      <button class="btn" id="del-cancel">取消</button>
      <button class="btn" id="del-ok" style="border-color: var(--warn); color: var(--warn)">移除</button>
    </div>

    <div class="actions">
      <button class="btn danger" id="remove" hidden><svg class="icon" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>移除角色</button>
      <span class="spacer"></span>
      <button class="btn" id="cancel">取消</button>
      <button class="btn primary" id="save">儲存</button>
    </div>
  </div>
  <script src="../mascots.js"></script>
  <script src="agent-editor.js"></script>
</body>
</html>
