<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>JWT 解碼</title>
<link rel="stylesheet" href="popup.css">
<style>
  /* 有效期限 */
  .status {
    display: flex; align-items: center; gap: 8px; margin: 0 14px 10px; padding: 7px 10px;
    border-radius: 8px; background: var(--surface); border: 1px solid var(--stroke); font-size: 12px;
  }
  .badge { font-weight: 600; white-space: nowrap; }
  .status .detail { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.valid .badge { color: var(--accent); }
  .status.expired, .status.pending { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
  .status.expired .badge, .status.pending .badge { color: var(--warn); }
  .status.none .badge { color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.valid .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status.expired .dot, .status.pending .dot { background: var(--warn); }

  #sec-header h2 { color: var(--c-header); }
  #sec-payload h2 { color: var(--c-payload); }
  #sec-sig h2 { color: var(--c-sig); }
  pre.sig { word-break: break-all; color: var(--c-sig); }
  /* 時間欄位 */
  .times { display: grid; grid-template-columns: auto auto 1fr; gap: 3px 10px; font-size: 12px; padding: 0 2px; }
  .times[hidden] { display: none; }
  .times .name { color: var(--muted); }
  .times .when { font-variant-numeric: tabular-nums; }
  .times .rel { color: var(--muted); text-align: right; white-space: nowrap; }
</style>
</head>
<body data-theme="dark">
  <div class="panel">
    <div class="titlebar">
      <h1>JWT 解碼</h1>
      <div class="chips" id="chips"></div>
      <button class="close" id="close" aria-label="關閉" title="關閉（Esc）">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="status" id="status" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span class="badge" id="badge"></span>
      <span class="detail" id="detail"></span>
    </div>

    <div class="content">
      <section id="sec-header">
        <div class="sec-head">
          <h2>HEADER<span class="sub">演算法與類型</span></h2>
          <button class="copy" data-copy="header"><svg class="icon cp" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="icon ok" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>複製</span></button>
        </div>
        <pre id="header"></pre>
      </section>

      <section id="sec-payload">
        <div class="sec-head">
          <h2>PAYLOAD<span class="sub">資料</span></h2>
          <button class="copy" data-copy="payload"><svg class="icon cp" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="icon ok" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>複製</span></button>
        </div>
        <pre id="payload"></pre>
        <div class="times" id="times"></div>
      </section>

      <section id="sec-sig">
        <div class="sec-head">
          <h2>SIGNATURE<span class="sub">簽章</span></h2>
          <button class="copy" data-copy="signature"><svg class="icon cp" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="icon ok" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>複製</span></button>
        </div>
        <pre class="sig" id="signature"></pre>
        <p class="note">只解碼內容，未驗證簽章（驗證需要簽發方的密鑰）。</p>
      </section>
    </div>

    <div class="footer">
      <button class="copy" data-copy="token"><svg class="icon cp" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="icon ok" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>複製原始 Token</span></button>
    </div>
  </div>
  <script src="jwt.js"></script>
</body>
</html>
