<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Claude 角色</title>
<link rel="stylesheet" href="popup.css">
<style>
  .titlebar { border-bottom: 1px solid var(--stroke); gap: 10px; padding: 12px 10px 10px 14px; }
  .avatar {
    flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--c, #6ea8fe) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c, #6ea8fe) 70%, transparent);
  }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .who-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .who-top h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cwd { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); min-width: 0; }
  .cwd span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-btn {
    -webkit-app-region: no-drag; flex: none; width: 28px; height: 28px; border-radius: 6px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .tb-btn:hover { background: var(--hover); color: var(--text); }
  .tb-btn:disabled { opacity: 0.4; cursor: default; background: none; }

  .confirm {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 12px;
    background: var(--surface); border-bottom: 1px solid var(--stroke);
  }
  .confirm span { flex: 1; }
  .btn {
    height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--stroke); color: var(--text);
    font-size: 12px; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); font-weight: 600; }
  .btn.warn { border-color: var(--warn); color: var(--warn); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* 對話 */
  .messages { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; user-select: text; }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .msg-user {
    align-self: flex-end; max-width: 80%; padding: 8px 11px; border-radius: 10px 10px 2px 10px; line-height: 1.55;
    background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-handoff {
    align-self: flex-end; max-width: 80%; padding: 8px 11px; border-radius: 10px 10px 2px 10px; line-height: 1.55;
    border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent);
    white-space: pre-wrap; word-break: break-word;
  }
  .handoff-from { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg-ai { position: relative; max-width: 96%; line-height: 1.65; word-break: break-word; }
  .msg-ai p, .msg-ai ul, .msg-ai ol, .msg-ai blockquote, .msg-ai .code-block, .msg-ai h3, .msg-ai h4, .msg-ai h5, .msg-ai h6 { margin: 0 0 8px; }
  .msg-ai > :last-child { margin-bottom: 0; }
  .msg-ai ul, .msg-ai ol { padding-left: 20px; }
  .msg-ai h3, .msg-ai h4, .msg-ai h5, .msg-ai h6 { font-size: 13px; }
  .msg-ai blockquote { padding-left: 10px; border-left: 2px solid var(--stroke); color: var(--muted); }
  .msg-ai hr { border: none; border-top: 1px solid var(--stroke); margin: 10px 0; }
  .msg-ai a { color: var(--accent); }
  .msg-ai code { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; font-size: 12px; padding: 1px 4px; border-radius: 4px; background: var(--surface); color: var(--j-str); }
  .code-block { border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; }
  .code-head { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px 3px 10px; font-size: 11px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--stroke); }
  .code-copy { font-size: 11px; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
  .code-copy:hover { color: var(--accent); background: var(--hover); }
  .code-block pre { border: none; border-radius: 0; margin: 0; overflow-x: auto; white-space: pre; }
  .code-block pre::-webkit-scrollbar { height: 8px; }
  .code-block pre::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }
  .code-block.code-wrap pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .code-block pre code { padding: 0; background: none; color: var(--text); }
  .msg-ai .copy-msg { position: absolute; right: -4px; bottom: -18px; font-size: 11px; color: var(--muted); padding: 1px 6px; border-radius: 4px; opacity: 0; transition: opacity 0.15s; }
  .msg-ai:hover .copy-msg { opacity: 1; }
  .copy-msg:hover { color: var(--accent); background: var(--hover); }
  .cursor { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tools { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
  .tool-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tool-line .detail { color: var(--text); opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-line svg { flex: none; }
  .tool-line.running .st-done, .tool-line.running .st-err { display: none; }
  .tool-line.done .st-run, .tool-line.done .st-err { display: none; }
  .tool-line.error .st-run, .tool-line.error .st-done { display: none; }
  .st-run { animation: spin 0.9s linear infinite; color: var(--accent); }
  .st-done { color: var(--accent); }
  .st-err { color: var(--warn); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .perm { padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--warn) 60%, transparent); display: flex; flex-direction: column; gap: 8px; }
  .perm-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--warn); }
  .perm pre { margin: 0; max-height: 140px; overflow: auto; background: rgba(0, 0, 0, 0.18); }
  .perm .note { margin-top: -2px; }
  .perm-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .err { padding: 8px 10px; border-radius: 8px; font-size: 12px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
  .status-line { font-size: 11px; color: var(--muted); }

  /* 輸入 */
  .composer { padding: 10px 12px 12px; border-top: 1px solid var(--stroke); display: flex; flex-direction: column; gap: 6px; }
  .input-row { display: flex; align-items: flex-end; gap: 6px; padding: 7px 7px 7px 11px; border-radius: 8px; background: var(--surface); border: 1px solid var(--stroke); }
  .input-row:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--stroke)); }
  textarea { flex: 1; min-width: 0; resize: none; border: none; outline: none; background: transparent; color: var(--text); font: inherit; line-height: 1.5; max-height: 120px; }
  .icon-btn { flex: none; width: 30px; height: 30px; border-radius: 6px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .send { border-radius: 50%; color: var(--accent); border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .send:disabled { opacity: 0.4; cursor: default; }
  .stop { border-radius: 50%; color: var(--warn); border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  /* API Key */
  .keyform { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 32px 40px; }
  .keyform .big { align-self: center; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
  .keyform h2 { font-size: 15px; text-align: center; }
  .keyform .lead { font-size: 12px; color: var(--muted); line-height: 1.6; text-align: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field input { height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--stroke); background: var(--surface); color: var(--text); font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .field a { align-self: flex-start; font-size: 11px; color: var(--accent); }
  .form-err { font-size: 12px; color: var(--warn); min-height: 16px; }
  .or { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); margin: -4px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--stroke); }
  .keyform .lead.small { font-size: 11px; margin-top: -8px; }
  .lock { display: flex; gap: 6px; font-size: 11px; color: var(--muted); line-height: 1.6; }
  /* 「不要再詢問」開啟：背景改暗紅色，提醒這個對話不會再詢問核准 */
  body.auto-approve { --panel: rgba(58, 16, 22, 0.97); --surface: #4a1c23; --hover: #5a2229; --stroke: #6e2f37; }
  body.auto-approve[data-theme="light"] { --panel: rgba(250, 228, 230, 0.98); --surface: #f5d3d7; --hover: #efc4c9; --stroke: #dca3aa; }
  .auto-chip { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 9px; color: #ff8a93; border: 1px solid #ff8a93; }
  body[data-theme="light"] .auto-chip { color: #b4232f; border-color: #b4232f; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-theme="dark">
  <div class="panel">
    <div class="titlebar">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <div class="who">
        <div class="who-top"><h1 id="title">Claude 角色</h1><span class="chip mono" id="model" hidden></span><span class="auto-chip" id="auto-chip" title="不要再詢問：修改檔案、執行指令不會等你核准" hidden>免詢問</span></div>
        <div class="cwd" id="cwd" hidden>
          <svg class="icon" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <span class="mono" id="cwd-text"></span>
        </div>
      </div>
      <button class="tb-btn" id="new-chat" title="新對話" aria-label="新對話"><svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
      <button class="tb-btn" id="edit" title="編輯角色" aria-label="編輯角色"><svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="tb-btn" id="close" title="關閉（Esc）" aria-label="關閉"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="confirm" id="confirm-new" hidden>
      <span>清除這個角色的對話紀錄，重新開始？</span>
      <button class="btn" id="confirm-cancel">取消</button>
      <button class="btn warn" id="confirm-ok">清除</button>
    </div>

    <div class="keyform" id="keyform" hidden>
      <span class="big" aria-hidden="true"><svg class="icon" width="24" height="24" viewBox="0 0 24 24"><path d="M2.6 17.4A2 2 0 0 0 2 18.8V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.2a2 2 0 0 0 1.4-.6l.8-.8a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r="1"/></svg></span>
      <div>
        <h2>選擇登入方式</h2>
        <p class="lead">角色可透過 API Key 使用 Claude（依用量計費），<br>只需要設定一次，所有角色共用。</p>
      </div>
      <div class="field">
        <label for="key">API Key</label>
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
        <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">到 Claude Console 建立 API Key</a>
      </div>
      <div class="form-err" id="key-err" role="alert"></div>
      <button class="btn primary" id="key-save" style="height: 34px">驗證並儲存</button>
      <div class="or"><span>或</span></div>
      <button class="btn" id="use-local" style="height: 34px">沿用本機 Claude Code 登入</button>
      <p class="lead small">使用你在這台電腦用 Claude Code 登入的帳號與方案額度，限自己使用。</p>
      <div class="lock">
        <svg class="icon" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>金鑰以作業系統的加密功能保存在這台電腦，不會寫進設定檔。之後可在「設定」中更換或刪除。</span>
      </div>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="composer" id="composer">
      <div class="input-row">
        <label for="input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">訊息</label>
        <textarea id="input" rows="2" placeholder="傳訊息…"></textarea>
        <button class="icon-btn" id="paste" title="貼上剪貼簿內容" aria-label="貼上剪貼簿內容"><svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
        <button class="icon-btn send" id="send" title="送出（Enter）" aria-label="送出"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
        <button class="icon-btn stop" id="stop" title="停止回覆" aria-label="停止回覆" hidden><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      </div>
      <div class="foot"><span>Enter 送出 · Shift + Enter 換行 · <span id="auto-key">Ctrl + Shift + A</span> 免詢問</span><span id="cost"></span></div>
    </div>
  </div>
  <script src="../mascots.js"></script>
  <script src="markdown.js"></script>
  <script src="agent-chat.js"></script>
</body>
</html>
