<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>CSP 檢查</title>
<link rel="stylesheet" href="popup.css">
<style>
  /* 嚴重度顏色（對應 csp_evaluator 的 Severity） */
  body {
    --sev-high: #ff6b6b;
    --sev-syntax: var(--j-lit);
    --sev-medium: var(--warn);
    --sev-maybe: #e5c07b;
    --sev-info: var(--c-sig);
    --sev-none: var(--muted);
  }
  body[data-theme="light"] {
    --sev-high: #c62828;
    --sev-maybe: #8a6d00;
  }
  .sev-high { --sev: var(--sev-high); }
  .sev-syntax { --sev: var(--sev-syntax); }
  .sev-medium, .sev-high-maybe { --sev: var(--sev-medium); }
  .sev-medium-maybe { --sev: var(--sev-maybe); }
  .sev-strict, .sev-info { --sev: var(--sev-info); }
  .sev-none { --sev: var(--sev-none); }
  .sev-ok { --sev: var(--accent); }

  /* 判定摘要 */
  .verdict {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border-radius: 8px; background: var(--surface); border: 1px solid var(--stroke);
  }
  .verdict .mark {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--sev, var(--muted)) 18%, transparent); color: var(--sev, var(--muted));
  }
  .verdict .body { flex: 1; min-width: 0; }
  .verdict .title { font-size: 15px; font-weight: 600; color: var(--sev, var(--text)); }
  .verdict .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .verdict[class*="sev-"] { border-color: color-mix(in srgb, var(--sev) 50%, transparent); }
  .verdict .mark svg { display: none; }
  .verdict.loading .i-loading { display: block; animation: spin 0.9s linear infinite; }
  .verdict.sev-ok .i-safe, .verdict.error .i-unknown { display: block; }
  .verdict:not(.loading):not(.sev-ok):not(.error) .i-warn { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .counts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .count {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 4px; font-size: 11px;
    color: var(--sev); background: color-mix(in srgb, var(--sev) 12%, transparent);
  }

  /* 來源網址 */
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; padding: 0 2px; }
  .facts dt { color: var(--muted); }
  .facts dd { min-width: 0; word-break: break-all; user-select: text; }

  /* 指令清單 */
  .policy-kind { font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 4px; }
  .dirs { display: flex; flex-direction: column; gap: 6px; }
  .dir {
    border: 1px solid var(--stroke); border-left: 3px solid var(--sev, var(--stroke));
    border-radius: 6px; background: var(--surface); padding: 6px 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .dir-head { display: flex; align-items: center; gap: 6px; }
  .dir-head .name { font-weight: 600; font-size: 12px; user-select: text; }
  .dir-head .missing { font-size: 11px; color: var(--muted); }
  .dir-head .badge { margin-left: auto; font-size: 11px; color: var(--sev); }
  .vals { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .vals li:not([class*="sev-"]) { --sev: initial; } /* 沒有發現的值不沿用指令的顏色 */
  .vals li { display: flex; flex-direction: column; gap: 1px; padding-left: 10px; position: relative; }
  .vals li::before {
    content: ""; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--sev, var(--tick));
  }
  .vals code {
    font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; font-size: 12px;
    color: var(--sev, var(--text)); word-break: break-all; user-select: text;
  }
  .more { align-self: flex-start; font-size: 12px; color: var(--accent); padding: 0 0 0 10px; }
  .more:hover { text-decoration: underline; }
  .msg { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .msg b { font-weight: 600; color: var(--sev); margin-right: 4px; }

  #policies { display: flex; flex-direction: column; gap: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-theme="dark">
  <div class="panel">
    <div class="titlebar">
      <h1>CSP 檢查</h1>
      <div class="chips" id="chips"></div>
      <button class="close" id="close" aria-label="關閉" title="關閉（Esc）">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="content">
      <div class="verdict loading" id="verdict" role="status" aria-live="polite">
        <div class="mark" aria-hidden="true">
          <svg class="icon i-loading" width="18" height="18" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
          <svg class="icon i-safe" width="18" height="18" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
          <svg class="icon i-warn" width="18" height="18" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <svg class="icon i-unknown" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </div>
        <div class="body">
          <div class="title" id="title">讀取中…</div>
          <div class="desc" id="desc"></div>
          <div class="counts" id="counts"></div>
        </div>
      </div>

      <dl class="facts" id="facts" hidden></dl>

      <div class="actions" id="report-actions" hidden>
        <button class="copy" data-copy="report"><svg class="icon cp" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="icon ok" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>複製檢查結果</span></button>
      </div>

      <div id="policies"></div>

      <p class="note">以 CSP3 規則分析（Google csp_evaluator）。結果僅供參考，請搭配實際頁面確認。</p>
    </div>
  </div>
  <script src="csp.js"></script>
</body>
</html>
