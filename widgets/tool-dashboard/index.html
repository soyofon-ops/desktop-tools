<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>工具儀表盤</title>
<style>
  /* 深色（預設） */
  body {
    --shape-fill: rgba(18, 21, 27, 0.94);
    --shape-stroke: #2f3644;
    --tick: #4a5363;
    --accent: #3dd6b5;
    --glow: rgba(61, 214, 181, 0.35);
    --btn-bg: #1d222b;
    --btn-border: #2c3340;
    --hover: #232a34;
    --slot: #353c49;
    --muted: #9aa3b2;
    --text: #e6e9ee;
    --warn: #f2994a;
    --danger: #f0524f;
    --ok-bg: #1c2e2b;
    --alert: #ffd21f;
    --alert-ink: #1a1400;
    --alert-glow: rgba(255, 210, 31, 0.62);
    --alert-danger-ink: #2a0605;
    --alert-danger-glow: rgba(240, 82, 79, 0.62);
  }
  body[data-theme="light"] {
    --shape-fill: rgba(247, 249, 252, 0.95);
    --shape-stroke: #d2d9e3;
    --tick: #b6c0cd;
    --accent: #0b8f75;
    --glow: rgba(11, 143, 117, 0.22);
    --btn-bg: #ebeff4;
    --btn-border: #d7dee7;
    --hover: #e1f2ee;
    --slot: #c6cfda;
    --muted: #5b6575;
    --text: #1b1f26;
    --warn: #c2620f;
    --danger: #d32f2f;
    --ok-bg: #ddf1ec;
    --alert: #ffc800;
    --alert-ink: #3a2c00;
    --alert-glow: rgba(214, 160, 0, 0.62);
    --alert-danger-ink: #4a0b0b;
    --alert-danger-glow: rgba(211, 47, 47, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", -apple-system, "PingFang TC", system-ui, sans-serif;
    color: var(--text);
  }

  /* 視窗 296 寬：左右各留 8px 給陰影；面板本體 280 × 104 */
  .stage { position: absolute; top: 8px; left: 8px; width: 280px; }
  .dash { position: relative; width: 280px; height: 104px; }

  /* Claude 角色面板：梯形上方，每頁 4 個 44px 吉祥物按鈕（含新增按鈕） */
  .agents {
    position: relative; height: 64px; margin-bottom: 6px; box-sizing: border-box;
    background: var(--shape-fill); border: 1px solid var(--shape-stroke); border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); transition: background 0.2s, border-color 0.2s;
  }
  .agents[hidden] { display: none; }
  .agents::before { content: ""; position: absolute; top: -1px; left: 106px; width: 68px; height: 2px; border-radius: 2px; background: var(--accent); }
  /* 左右外擴 10px、上下外擴 6px 讓光暈與提示動畫不被切掉；頁與頁之間隔 20px，鄰頁不會露出來 */
  .agents-viewport { position: absolute; top: -6px; bottom: -6px; left: 11px; width: 256px; padding-left: 10px; overflow: hidden; }
  .agents-track { display: flex; align-items: center; gap: 20px; width: max-content; height: 100%; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .agents .arrow { top: 17px; width: 16px; z-index: 2; }
  .agents .arrow.prev { left: 2px; }
  .agents .arrow.next { right: 2px; }
  /* 其他頁有角色需要注意 */
  .agents .arrow.has-alert::after { content: ""; position: absolute; top: 1px; right: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .agents .arrow.alert-error::after { background: var(--danger); }
  /* 其他頁有提示：左上角三條漫畫線，外框呼吸。回覆失敗優先顯示紅色 */
  .agents.alert-danger { --alert: var(--danger); --alert-ink: var(--alert-danger-ink); --alert-glow: var(--alert-danger-glow); }
  /* 外框與光暈放在獨立圖層，只動畫 opacity，提示久放時不用每格重繪陰影 */
  .agents.alerting::after {
    content: ""; position: absolute; inset: -1px; z-index: 1; pointer-events: none;
    border: 1px solid var(--alert); border-radius: 12px; box-shadow: 0 0 8px 1px var(--alert-glow);
    animation: agents-breathe 3.2s ease-in-out infinite; /* 週期是線條的兩倍 */
  }
  @keyframes agents-breathe {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  /* SVG 座標等於視窗座標（面板距視窗邊緣 8px + 1px 邊框），線條跨在圓角上才不會被視窗裁切 */
  .agents-alert-lines { display: none; position: absolute; left: -9px; top: -9px; width: 44px; height: 44px; overflow: visible; pointer-events: none; z-index: 3; }
  .agents.alerting .agents-alert-lines { display: block; }
  .agents-alert-lines g { transform-origin: 26px 26px; animation: agents-lines-pop 1.6s linear infinite; }
  .agents-alert-lines g:nth-child(2) { animation-delay: 0.05s; }
  .agents-alert-lines g:nth-child(3) { animation-delay: 0.1s; }
  .agents-alert-lines line { stroke-linecap: round; }
  .agents-alert-lines .ink { stroke: var(--alert-ink); stroke-width: 5; }
  .agents-alert-lines .fill { stroke: var(--alert); stroke-width: 3; }
  @keyframes agents-lines-pop {
    0% { transform: scale(0.45); opacity: 0; }
    6% { transform: scale(1.12); opacity: 1; animation-timing-function: ease-out; }
    14%, 34% { transform: scale(1); }
    40% { transform: scale(1.08); }
    48% { transform: scale(1); }
    74% { transform: scale(1); opacity: 1; }
    84%, 100% { transform: scale(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .agents.alerting::after, .agents-alert-lines g { animation: none; }
  }
  .agent {
    position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 70%, transparent);
    transition: transform 0.08s, box-shadow 0.15s;
    --ring: var(--c);
    --ring-start: color-mix(in srgb, var(--c) 55%, transparent);
  }
  /* 淺色主題下部分角色色與面板對比不足，光圈改用加深的顏色 */
  body[data-theme="light"] .agent {
    --ring: color-mix(in srgb, var(--c) 65%, #000);
    --ring-start: color-mix(in srgb, var(--ring) 80%, transparent);
  }
  .agent:hover { box-shadow: 0 0 0 1px var(--c), 0 0 12px color-mix(in srgb, var(--c) 40%, transparent); }
  .agent:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .agent:active { transform: scale(0.94); }
  /* 天線等部件會超出 viewBox，不加 overflow 會被裁切 */
  .agent svg { display: block; pointer-events: none; overflow: visible; }
  .agent.running { animation: agent-pulse 1.6s ease-out var(--loop-delay, 0s) infinite; }
  @keyframes agent-pulse {
    0% { box-shadow: 0 0 0 0 var(--ring-start); }
    70%, 100% { box-shadow: 0 0 0 8px transparent; }
  }
  .agent .badge { display: none; position: absolute; top: -2px; right: -2px; width: 13px; height: 13px; box-sizing: border-box; border-radius: 50%; background: var(--warn); border: 2px solid var(--shape-fill); }
  .agent.waiting .badge { display: block; }
  /* 需要注意：等待回覆、回覆完成為橘色，回覆失敗為紅色。用 translate 彈跳，不與拖曳讓位的 transform 衝突 */
  .agent.attn {
    --attn: var(--warn);
    border-color: var(--attn); background: color-mix(in srgb, var(--attn) 18%, transparent);
    animation: agent-bounce 1.6s ease-in-out var(--attn-delay, 0s) infinite, agent-attn-ring 1.6s ease-out var(--attn-delay, 0s) infinite;
  }
  .agent.attn-error {
    --attn: var(--danger);
    animation: agent-shake 1.6s ease-in-out var(--attn-delay, 0s) infinite, agent-attn-ring 1.6s ease-out var(--attn-delay, 0s) infinite;
  }
  /* 回覆完成：彈跳 2 次就停，光圈持續到看過為止 */
  .agent.attn-done { animation: agent-bounce 1.6s ease-in-out var(--attn-delay, 0s) 2, agent-attn-ring 1.6s ease-out var(--attn-delay, 0s) infinite; }
  .agent.attn:not(.attn-sticky) { animation-iteration-count: 2; } /* 聊天視窗開著時只提示一下，總長對應 ATTN_ONCE_MS */
  .agent.attn-sticky .badge { display: block; background: var(--attn); }
  @keyframes agent-bounce {
    0%, 40%, 100% { translate: 0 0; }
    12% { translate: 0 -7px; }
    24% { translate: 0 0; }
    32% { translate: 0 -3px; }
  }
  @keyframes agent-attn-ring {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--attn) 65%, transparent); }
    70%, 100% { box-shadow: 0 0 0 9px transparent; }
  }
  @keyframes agent-shake {
    0%, 32%, 100% { translate: 0 0; }
    6%, 18% { translate: -2.5px 0; }
    12%, 24% { translate: 2.5px 0; }
  }

  /* ---- 吉祥物狀態動畫：表情區分狀態，動作只強化。SVG 子元素的 px 都是 viewBox 單位（32px 下 1px = 螢幕 1.33px）---- */
  .agent svg * { transform-box: view-box; }
  .agent .m-fx, .agent .m-motion { transform-origin: 12px var(--m-oy); }
  .agent .m-eyes { transform-origin: 12px var(--m-ey); }
  .agent .m-ghost .m-motion { transform-origin: 12px 3px; }
  .agent .m-antenna { transform-origin: 12px 5.8px; }
  .agent .m-cat .m-ear-l { transform-origin: 7px 9px; }
  .agent .m-cat .m-ear-r { transform-origin: 17px 9px; }
  .agent .m-bear .m-ear-l { transform-origin: 8px 9px; }
  .agent .m-bear .m-ear-r { transform-origin: 16px 9px; }

  /* 靜態表情 */
  .agent[data-mood="waiting"] .m-eyes { transform: translateY(-0.6px) scale(1.2); }
  .agent[data-mood="waiting"]:not(.attn) .m-motion { transform: rotate(-6deg); }
  .agent[data-mood="done"] .m-gaze, .agent[data-mood="error"] .m-gaze { display: none; }
  .agent[data-mood="done"] .m-eyes-done, .agent[data-mood="error"] .m-eyes-error { display: inline; }
  .agent[data-mood="done"] .m-cheek { opacity: 0.9; }
  .agent[data-mood="error"] .m-motion { transform: translateY(1px) scale(1.03, 0.95); }
  .agent[data-mood="error"] svg:not(.m-ghost) .m-mouth { transform-origin: 12px var(--m-my); transform: scaleY(-1); }

  /* 回覆中：造型專屬動作 1.6s、視線與招牌部件 3.2s */
  .agent[data-mood="running"] .m-motion { animation: 1.6s ease-in-out var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-blob .m-motion { animation-name: m-run-jelly; }
  .agent[data-mood="running"] .m-robot .m-motion,
  .agent[data-mood="running"] .m-cat .m-motion,
  .agent[data-mood="running"] .m-bear .m-motion { animation-name: m-run-bob; }
  .agent[data-mood="running"] .m-ghost .m-motion { animation-name: m-run-float; }
  .agent[data-mood="running"] .m-drop .m-motion { animation-name: m-run-sway; }
  .agent[data-mood="running"] .m-cloud .m-motion { animation-name: m-run-drift; }
  .agent[data-mood="running"] .m-owl .m-motion { animation-name: m-run-tilt; }
  .agent[data-mood="running"] .m-gaze { animation: m-gaze 3.2s cubic-bezier(0.4, 0, 0.2, 1) var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-owl .m-gaze { animation-name: m-gaze-wide; }
  .agent[data-mood="running"] .m-cheek { animation: m-cheek 3.2s ease-in-out var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-shine { animation: m-shine 3.2s ease-in-out var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-antenna { animation: m-antenna 3.2s ease-in-out var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-antenna-ball { animation: m-antenna-ball 3.2s ease-in-out var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-cat .m-ear-r { animation: m-ear-twitch 3.2s linear var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-bear .m-ear-l { animation: m-ear-first 3.2s ease-in-out var(--loop-delay, 0s) infinite; }
  .agent[data-mood="running"] .m-bear .m-ear-r { animation: m-ear-second 3.2s ease-in-out var(--loop-delay, 0s) infinite; }

  /* 需要注意：與外層彈跳共用 --attn-delay，節奏才會對齊 */
  .agent.attn[data-mood="waiting"] .m-motion { animation: m-look 1.6s ease-in-out var(--attn-delay, 0s) infinite; }
  .agent.attn:not(.attn-sticky)[data-mood="waiting"] .m-motion { animation-iteration-count: 2; }
  .agent.attn[data-mood="done"] .m-motion { animation: m-hop 1.6s ease-in-out var(--attn-delay, 0s) 2; }

  /* 狀態切換：只播一次，--fx-delay 讓按鈕重建時接續進度 */
  .agent.fx-run .m-fx { animation: m-squash 320ms ease-out var(--fx-delay, 0s) 1; }
  .agent.fx-nod .m-fx { animation: m-nod 360ms ease-in-out var(--fx-delay, 0s) 1; }
  .agent.fx-flinch .m-fx { animation: m-flinch 400ms ease-out var(--fx-delay, 0s) 1; }
  .agent.fx-eyes .m-eyes { animation: m-eyes-in 240ms ease-out var(--fx-delay, 0s) 1; }

  /* 閒置：由 JS 排程加上 class，播完移除；不使用無限循環，閒置時才不會持續重繪 */
  .agent[data-mood="idle"].m-blink-play .m-eyes { animation: m-blink 180ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-cheek { animation: m-cheek 600ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-shine { animation: m-shine 600ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-antenna { animation: m-antenna 600ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-antenna-ball { animation: m-antenna-ball 600ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-cat .m-ear-r { animation: m-sig-ear 600ms linear 1; }
  .agent[data-mood="idle"].m-sig .m-bear .m-ear-l { animation: m-ear-first 600ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-bear .m-ear-r { animation: m-ear-second 600ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-ghost .m-motion { animation: m-sig-ghost 600ms ease-in-out 1; }
  .agent[data-mood="idle"].m-sig .m-owl .m-gaze { animation: m-sig-owl 600ms ease-in-out 1; }

  @keyframes m-hop {
    0%, 40%, 100% { transform: none; }
    12% { transform: scale(0.94, 1.07); }
    24% { transform: scale(1.07, 0.92); }
    32% { transform: scale(0.98, 1.03); }
  }
  @keyframes m-look { /* 跳動結束後才張望 */
    0%, 40%, 84%, 100% { transform: none; }
    12% { transform: scale(0.94, 1.07); }
    24% { transform: scale(1.07, 0.92); }
    32% { transform: scale(0.98, 1.03); }
    52% { transform: rotate(-7deg); }
    68% { transform: rotate(7deg); }
  }
  @keyframes m-flinch {
    0%, 100% { transform: none; }
    30% { transform: scale(1.08, 0.86); }
    65% { transform: scale(0.97, 1.02); }
  }
  @keyframes m-squash {
    0%, 100% { transform: none; }
    35% { transform: scale(1.06, 0.92); }
    70% { transform: scale(0.97, 1.05); }
  }
  @keyframes m-nod {
    0%, 100% { transform: none; }
    50% { transform: translateY(1.5px); }
  }
  @keyframes m-eyes-in {
    0% { transform: translateY(-0.6px) scale(0.6); }
    65% { transform: translateY(-0.6px) scale(1.3); }
    100% { transform: translateY(-0.6px) scale(1.2); }
  }
  @keyframes m-blink {
    0%, 100% { transform: none; }
    40%, 60% { transform: scaleY(0.12); }
  }
  @keyframes m-gaze {
    0%, 8%, 92%, 100% { transform: none; }
    16%, 42% { transform: translateX(-1px); }
    58%, 84% { transform: translateX(1px); }
  }
  @keyframes m-gaze-wide {
    0%, 8%, 92%, 100% { transform: none; }
    16%, 42% { transform: translateX(-1.1px); }
    58%, 84% { transform: translateX(1.1px); }
  }
  @keyframes m-run-jelly {
    0%, 100% { transform: scale(1.05, 0.95); }
    50% { transform: scale(0.97, 1.04); }
  }
  @keyframes m-run-bob {
    0%, 100% { transform: none; }
    50% { transform: translateY(-1px); }
  }
  @keyframes m-run-float {
    0%, 100% { transform: translateY(1.2px) skewX(4deg); }
    50% { transform: translateY(-1.2px) skewX(-4deg); }
  }
  @keyframes m-run-sway {
    0%, 100% { transform: skewX(3deg); }
    50% { transform: skewX(-3deg); }
  }
  @keyframes m-run-drift {
    0%, 100% { transform: translateX(-1px) scale(1.02, 0.98); }
    50% { transform: translateX(1px) scale(0.98, 1.02); }
  }
  @keyframes m-run-tilt {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  @keyframes m-cheek {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  @keyframes m-shine {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.95; }
  }
  @keyframes m-antenna {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  @keyframes m-antenna-ball {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes m-ear-twitch { /* 3.2s 週期內只抖 2 下 */
    0%, 20%, 100% { transform: none; }
    4% { transform: rotate(10deg); }
    8% { transform: rotate(-10deg); }
    12% { transform: rotate(10deg); }
    16% { transform: rotate(-10deg); }
  }
  @keyframes m-sig-ear {
    0%, 100% { transform: none; }
    20% { transform: rotate(10deg); }
    40% { transform: rotate(-10deg); }
    60% { transform: rotate(10deg); }
    80% { transform: rotate(-10deg); }
  }
  @keyframes m-ear-first { /* 雙耳輪流：前半週期 */
    0%, 50%, 100% { transform: none; }
    17% { transform: rotate(-10deg); }
    34% { transform: rotate(10deg); }
  }
  @keyframes m-ear-second { /* 雙耳輪流：後半週期 */
    0%, 50%, 100% { transform: none; }
    67% { transform: rotate(10deg); }
    84% { transform: rotate(-10deg); }
  }
  @keyframes m-sig-ghost {
    0%, 100% { transform: none; }
    30% { transform: translateY(-1.2px) skewX(-4deg); }
    70% { transform: translateY(0.6px) skewX(4deg); }
  }
  @keyframes m-sig-owl {
    0%, 100% { transform: none; }
    30% { transform: translateX(-1.1px); }
    70% { transform: translateX(1.1px); }
  }

  /* 減少動態：停用所有動畫，保留靜態表情與姿勢；光圈改為固定外框 */
  @media (prefers-reduced-motion: reduce) {
    .agent, .agent svg, .agent svg * { animation: none !important; }
    .agent[data-mood="running"] .m-gaze { transform: translateX(1px); }
    .agent[data-mood="running"] { box-shadow: 0 0 0 2px var(--ring); }
    .agent[data-mood="waiting"] .m-motion { transform: rotate(-6deg); }
    .agent.attn { box-shadow: 0 0 0 2px var(--attn); }
  }
  .agent .open-dot { display: none; position: absolute; bottom: -8px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--c); }
  .agent.open .open-dot { display: block; }
  .agent-add {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px dashed var(--slot); color: var(--muted);
    display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s;
  }
  .agent-add:hover { border-color: var(--accent); color: var(--accent); }
  .agent.dragging { opacity: 0.35; }
  .agent-ghost { position: absolute; z-index: 5; pointer-events: none; transform: scale(1.1); box-shadow: 0 0 0 1px var(--c), 0 6px 12px rgba(0, 0, 0, 0.35) !important; animation: none !important; }
  .agent-ghost.over-arrow { opacity: 0.45; transition: opacity 0.12s; }
  /* 拖曳中與不在目前頁面的按鈕不播動畫；切回頁面時由 refreshAgentTiming 重算負延遲接續 */
  .agent[inert],
  .agent-ghost svg, .agent-ghost svg *,
  .agent.dragging svg, .agent.dragging svg *,
  .agent[inert] svg, .agent[inert] svg * { animation: none !important; }
  html.widget-dragging .dash { cursor: grabbing; }

  /* 倒梯形：斜邊每往下 5px 內縮 1px，下方通知沿用同一斜率 */
  .shape { position: absolute; inset: 0; overflow: visible; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35)); }
  .shape .body { fill: var(--shape-fill); stroke: var(--shape-stroke); stroke-width: 1; transition: fill 0.2s, stroke 0.2s; }
  .shape .accent { stroke: var(--accent); stroke-linecap: round; fill: none; }
  .shape .tick { stroke: var(--tick); stroke-linecap: round; fill: none; }

  button { font: inherit; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  svg.icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* 深淺切換 */
  .mode {
    position: absolute; top: 0; right: 1px; width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; color: var(--muted); transition: color 0.15s;
  }
  .mode:hover { color: var(--accent); }
  .mode .sun { display: none; }
  body[data-theme="light"] .mode .sun { display: block; }
  body[data-theme="light"] .mode .moon { display: none; }

  /* 分頁箭頭 */
  .arrow {
    position: absolute; top: 40px; width: 20px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; color: var(--muted); transition: color 0.15s, background 0.15s;
  }
  .arrow:hover { color: var(--accent); background: var(--hover); }
  .arrow[hidden] { display: none; }
  .arrow.prev { left: 20px; }
  .arrow.next { right: 20px; }

  /* 按鈕區：每頁 5 × 2，直徑 28，間距 12 */
  /* 外擴 8px 讓 hover 光暈不被切掉；頁與頁之間隔 16px，鄰頁不會露出來 */
  .viewport { position: absolute; top: 12px; left: 38px; width: 204px; height: 84px; padding: 8px; overflow: hidden; }
  .track { display: flex; gap: 16px; width: max-content; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .page {
    flex: none; width: 188px;
    display: grid; grid-template-columns: repeat(5, 28px); grid-template-rows: repeat(2, 28px); gap: 12px;
  }
  .tool {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--accent);
    transition: background 0.15s, box-shadow 0.15s, transform 0.08s;
  }
  .tool:hover { background: var(--hover); box-shadow: 0 0 0 1px var(--accent), 0 0 12px var(--glow); }
  .tool:active { transform: scale(0.94); }
  .tool.done { background: var(--ok-bg); }
  .tool.busy { opacity: 0.6; pointer-events: none; }
  .tool svg.icon { width: 14px; height: 14px; stroke-width: 2.2; }
  .slot { width: 28px; height: 28px; border-radius: 50%; border: 1px dashed var(--slot); }

  /* 拖曳調整順序 */
  html.tool-dragging, html.tool-dragging * { cursor: grabbing !important; }
  .tool.placeholder { background: transparent !important; border: 1px dashed var(--accent); box-shadow: none !important; }
  .tool.placeholder svg { opacity: 0; }
  .tool.ghost {
    position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; transition: none;
    background: var(--hover);
    box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow), 0 6px 12px rgba(0, 0, 0, 0.35);
  }
  .arrow.drag-over { color: var(--accent); background: var(--hover); box-shadow: 0 0 0 1px var(--accent); z-index: 6; }
  /* 拖到箭頭上時鬼影變淡，看得到箭頭亮起 */
  .tool.ghost.over-arrow { opacity: 0.45; transition: opacity 0.12s; }

  /* 頁碼 */
  .dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 6px; }
  .dots span { display: block; width: 4px; height: 3px; border-radius: 2px; background: var(--tick); transition: width 0.25s, background 0.25s; }
  .dots span.on { width: 14px; background: var(--accent); }

  /* 工具提示：滑鼠移入按鈕時顯示在面板下方，箭頭指向該按鈕 */
  .tip {
    position: absolute; top: 180px; left: 0; height: 24px; padding: 0 10px; z-index: 8;
    display: flex; align-items: center;
    font-size: 12px; white-space: nowrap; color: var(--text);
    background: var(--shape-fill); border: 1px solid var(--shape-stroke); border-radius: 6px;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    opacity: 0; transform: translateY(-3px); transition: opacity 0.12s, transform 0.12s;
    pointer-events: none;
  }
  .tip.show { opacity: 1; transform: none; }
  .tip[hidden] { display: none; }
  .tip::before {
    content: ""; position: absolute; top: -4px; left: var(--caret, 50%);
    width: 7px; height: 7px; margin-left: -4px;
    background: inherit; border-left: 1px solid var(--shape-stroke); border-top: 1px solid var(--shape-stroke);
    transform: rotate(45deg);
  }

  /* 通知：在面板下方 6px，斜邊與面板斜邊在同一直線上 */
  .toast { position: absolute; top: 180px; left: 22px; width: 236px; height: 32px; opacity: 0; transform: translateY(-4px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast[hidden] { display: none; }
  .toast .shape { filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3)); }
  .toast .body { stroke: var(--accent); }
  .toast.error .body { stroke: var(--warn); }
  .toast-content {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; white-space: nowrap;
  }
  .toast svg.icon { width: 14px; height: 14px; stroke-width: 2.5; color: var(--accent); }
  .toast.error svg.icon { color: var(--warn); }
  .toast .err-icon { display: none; }
  .toast.error .ok-icon { display: none; }
  .toast.error .err-icon { display: block; }
  .toast .swatch { display: none; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--shape-stroke); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15); }
  .toast.has-color .ok-icon { display: none; }
  .toast.has-color .swatch { display: block; }
  .toast.has-color #toast-text { font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-theme="dark">
  <div class="stage">
    <div class="agents" id="agents" role="toolbar" aria-label="Claude 角色">
      <button class="arrow prev" id="agents-prev" hidden>
        <svg class="icon" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="agents-viewport"><div class="agents-track" id="agents-track"></div></div>
      <button class="arrow next" id="agents-next" hidden>
        <svg class="icon" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <svg class="agents-alert-lines" viewBox="0 0 44 44" aria-hidden="true">
        <g><line class="ink" x1="13.33" y1="23.07" x2="5.54" y2="21.27"/><line class="fill" x1="13.33" y1="23.07" x2="5.54" y2="21.27"/></g>
        <g><line class="ink" x1="14.69" y1="14.69" x2="5.49" y2="5.49"/><line class="fill" x1="14.69" y1="14.69" x2="5.49" y2="5.49"/></g>
        <g><line class="ink" x1="23.07" y1="13.33" x2="21.27" y2="5.54"/><line class="fill" x1="23.07" y1="13.33" x2="21.27" y2="5.54"/></g>
      </svg>
    </div>
    <div class="dash" id="dash">
      <svg class="shape" width="280" height="104" viewBox="0 0 280 104" aria-hidden="true">
        <path class="body" d="M 8 0 L 272 0 Q 280 0 278.43 7.85 L 260.77 96.15 Q 259.2 104 251.2 104 L 28.8 104 Q 20.8 104 19.23 96.15 L 1.57 7.85 Q 0 0 8 0 Z"/>
        <path class="accent" d="M 106 1 L 174 1" stroke-width="2"/>
        <path class="accent" d="M 114 4.5 L 166 4.5" stroke-width="1" stroke-opacity="0.35"/>
        <path class="tick" d="M 14 5 L 24 5 M 9 9 L 9 16" stroke-width="1"/>
      </svg>

      <button class="mode" id="theme" data-tip="切換為淺色模式" aria-label="切換為淺色模式">
        <svg class="icon moon" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon sun" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>

      <button class="arrow prev" id="prev" data-tip="上一頁" aria-label="上一頁" hidden>
        <svg class="icon" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="arrow next" id="next" data-tip="下一頁" aria-label="下一頁" hidden>
        <svg class="icon" width="12" height="12" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>

      <div class="viewport"><div class="track" id="track"></div></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>

    <div class="tip" id="tip" role="tooltip" hidden><span id="tip-text"></span></div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <svg class="shape" width="236" height="32" viewBox="0 0 236 32" aria-hidden="true">
        <path class="body" d="M 6 0 L 230 0 Q 236 0 234.82 5.89 L 230.78 26.11 Q 229.6 32 223.6 32 L 12.4 32 Q 6.4 32 5.18 26.11 L 1.18 5.89 Q 0 0 6 0 Z"/>
      </svg>
      <div class="toast-content">
        <svg class="icon ok-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <svg class="icon err-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v8"/><path d="M12 18h.01"/></svg>
        <span class="swatch" id="toast-swatch" aria-hidden="true"></span>
        <span id="toast-text"></span>
      </div>
    </div>
  </div>
  <script src="mascots.js"></script>
  <script src="tools.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
