<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>Soyofon Desktop Tools 設定</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="crystal"></span>
      <div>
        <div class="brand-name">Desktop Tools</div>
        <div class="brand-sub" id="version"></div>
      </div>
    </div>
    <nav>
      <button class="nav-item active" data-tab="general">一般</button>
      <button class="nav-item" data-tab="widgets">小工具</button>
      <button class="nav-item" data-tab="database">資料庫</button>
    </nav>
  </aside>

  <main>
    <!-- 一般 -->
    <section class="tab active" id="tab-general">
      <header class="tab-head"><h1>一般</h1></header>
      <div class="card">
        <label class="row">
          <div>
            <div class="row-title">開機時自動啟動</div>
            <div class="row-desc" id="autostart-desc">登入系統後自動執行並還原小工具</div>
          </div>
          <span class="switch"><input type="checkbox" id="opt-autostart"><span class="track"></span></span>
        </label>
        <label class="row">
          <div>
            <div class="row-title">鎖定所有小工具位置</div>
            <div class="row-desc">鎖定後無法拖曳，避免誤觸移動</div>
          </div>
          <span class="switch"><input type="checkbox" id="opt-locked"><span class="track"></span></span>
        </label>
      </div>
      <h2>Claude 角色</h2>
      <div class="card">
        <div class="row">
          <div><div class="row-title">登入方式</div><div class="row-desc" id="auth-desc">讀取中…</div></div>
          <select id="auth-mode" class="auth-select" aria-label="登入方式">
            <option value="apiKey">Anthropic API Key</option>
            <option value="claudeCode">沿用本機 Claude Code 登入</option>
          </select>
        </div>
        <div class="row" id="row-local" hidden>
          <div class="local-main">
            <div class="row-title">本機 Claude Code</div>
            <div class="row-desc" id="local-status" role="status">檢查中…</div>
            <div class="local-login" id="local-login" hidden>
              <div class="row-desc" id="login-status" role="status"></div>
              <div class="login-code">
                <input type="text" id="login-code" placeholder="瀏覽器顯示授權碼時，貼在這裡" autocomplete="off" spellcheck="false" aria-label="授權碼">
                <button class="btn small" id="btn-login-code">送出</button>
                <button class="btn small" id="btn-login-copy" hidden>複製登入網址</button>
                <button class="btn small ghost" id="btn-login-cancel">取消</button>
              </div>
            </div>
          </div>
          <span class="btn-group">
            <button class="btn primary" id="btn-local-login" hidden title="會更新這台電腦 Claude Code 的登入，終端機的 Claude Code 也會使用新的登入">登入 Claude</button>
            <button class="btn" id="btn-local-check">重新檢查</button>
          </span>
        </div>
        <div class="row" id="row-usage">
          <div class="usage-main">
            <div class="row-title">方案使用量<span class="usage-plan" id="usage-plan" hidden></span></div>
            <div class="row-desc" id="usage-status" role="status"></div>
            <div class="usage-list" id="usage-list"></div>
          </div>
          <button class="btn" id="btn-usage-refresh" hidden>重新整理</button>
        </div>
        <div class="row" id="row-key">
          <div><div class="row-title">Anthropic API Key</div><div class="row-desc" id="key-status">讀取中…</div></div>
          <span class="btn-group">
            <button class="btn danger" id="btn-key-clear" hidden>刪除</button>
            <button class="btn" id="btn-key-set">設定</button>
          </span>
        </div>
        <div class="row">
          <div><div class="row-title">子代理資料夾</div><div class="row-desc mono" id="path-agents"></div></div>
          <button class="btn" id="btn-agents-dir">開啟</button>
        </div>
      </div>
      <h2>檔案位置</h2>
      <div class="card">
        <div class="row">
          <div><div class="row-title">設定檔</div><div class="row-desc mono" id="path-config"></div></div>
          <button class="btn" data-open="config">顯示</button>
        </div>
        <div class="row">
          <div><div class="row-title">資料庫</div><div class="row-desc mono" id="path-database"></div></div>
          <button class="btn" data-open="database">顯示</button>
        </div>
        <div class="row">
          <div><div class="row-title">自訂小工具資料夾</div><div class="row-desc mono" id="path-userWidgets"></div></div>
          <button class="btn" data-open="userWidgets">開啟</button>
        </div>
      </div>
    </section>

    <!-- 小工具 -->
    <section class="tab" id="tab-widgets">
      <header class="tab-head">
        <h1>小工具</h1>
        <button class="btn" id="btn-rescan">重新掃描</button>
      </header>
      <div class="card" id="widget-list"></div>
    </section>

    <!-- 資料庫 -->
    <section class="tab" id="tab-database">
      <div class="db-layout">
        <div class="db-cats">
          <div class="db-cats-head">
            <h1>資料庫</h1>
            <button class="btn primary small" id="btn-new-cat">＋ 分類</button>
          </div>
          <div class="db-cats-tools">
            <button class="btn small ghost" id="btn-import" title="從 JSON 檔匯入分類、欄位與資料">⇣ 匯入</button>
            <button class="btn small ghost" id="btn-export-all" title="把所有分類匯出成一個 JSON 檔">⇡ 匯出全部</button>
          </div>
          <div id="cat-list" class="cat-list"></div>
        </div>
        <div class="db-detail" id="db-detail"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-error" id="modal-error"></div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn primary" id="modal-ok">確定</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="settings.js"></script>
</body>
</html>
